services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sec-rag-backend
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
      - ./sec_rag.db:/app/sec_rag.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/stats"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sec-rag-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8001
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
